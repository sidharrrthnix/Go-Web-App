services:
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simple
    ports:
      - 5434:5432
    volumes:
      # PostgreSQL 18+ requires mounting at /var/lib/postgresql (not /data subdirectory)
      - postgres_data:/var/lib/postgresql
      - ./model/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    restart: always
    environment:
      ADMINER_DESIGN: dracula
    ports:
      - 3333:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
